<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AirSense</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AirSense">
    <link rel="apple-touch-icon" href="core/static/core/icons/pwa-192.png">
    
    <link rel="icon" type="image/x-icon" href="core/static/core/icons/favicon_airsense.ico">
    <link rel="stylesheet" href="core/static/core/css/home.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e3f2fd 100%);
            min-height: 100vh;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.1);
        }

        .profile-header h1 {
            color: #007bff;
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.1);
            margin-bottom: 20px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #007bff;
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e3f2fd;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e3f2fd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .checkbox-item:hover {
            background: #e3f2fd;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-left">
            <a href="index.html" class="home-link">
                <img src="core/static/core/icons/cloud.png" alt="AirSense" class="site-icon">
                <span class="logo-text">AirSense</span>
            </a>
        </div>
        <div class="header-right">
            <span id="onlineStatus" style="margin-right: 15px; font-size: 0.9em;"></span>
            <button id="langToggle" class="lang-toggle">RO</button>
            <a href="history.html" style="margin-left: 15px;">History</a>
            <a href="profile.html" style="margin-left: 15px;">Profile</a>
        </div>
    </header>
    
    <main>
        <div class="profile-container">
            <div class="profile-header">
                <h1>👤 User Profile</h1>
            </div>
            
            <div id="messageContainer"></div>
            
            <!-- Profile Information Form -->
            <div class="profile-card">
                <form id="profileForm">
                    <div class="form-section">
                        <h3 class="section-title">📝 Personal Information</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Username:</label>
                                <input type="text" id="username" name="username" required>
                            </div>
                            
                            <div class="form-group">
                                <label>Email:</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Full Name:</label>
                            <input type="text" id="full_name" name="full_name" required>
                        </div>
                    </div>
                
                    <div class="form-section">
                        <h3 class="section-title">⚙️ Preferences</h3>
                        
                        <div class="form-group">
                            <label>Timezone:</label>
                            <select id="timezone" name="timezone">
                                <option value="UTC">UTC</option>
                                <option value="Europe/Bucharest">Bucharest</option>
                                <option value="Europe/London">London</option>
                                <option value="Europe/Paris">Paris</option>
                                <option value="Europe/Berlin">Berlin</option>
                                <option value="America/New_York">New York</option>
                                <option value="Asia/Tokyo">Tokyo</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>🌿 Allergies:</label>
                            <div class="checkbox-group">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="allergy_alder" name="allergies" value="alder">
                                    <span>🌳 Alder Pollen</span>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="allergy_birch" name="allergies" value="birch">
                                    <span>🌳 Birch Pollen</span>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="allergy_grass" name="allergies" value="grass">
                                    <span>🌿 Grass Pollen</span>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="allergy_mugwort" name="allergies" value="mugwort">
                                    <span>🌿 Mugwort Pollen</span>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="allergy_olive" name="allergies" value="olive">
                                    <span>🌳 Olive Pollen</span>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="allergy_ragweed" name="allergies" value="ragweed">
                                    <span>🌿 Ragweed Pollen</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            ✨ Update Profile
                        </button>
                        <button type="button" id="clearDataBtn" class="btn btn-danger">
                            🗑️ Clear All Data
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <footer class="site-footer">
        <div class="footer-content">
            <a href="https://github.com/andreisugu/airsense" target="_blank">GitHub Repository</a> | 
            <span>Privacy Note: This static version runs entirely in your browser. No data is stored on any server.</span>
        </div>
    </footer>
    
    <script src="core/static/core/js/translations.js"></script>
    <script src="core/static/core/js/pwa-features.js"></script>
    <script>
        // Load profile data from localStorage
        function loadProfile() {
            const profile = JSON.parse(localStorage.getItem('userProfile') || '{}');
            
            document.getElementById('username').value = profile.username || '';
            document.getElementById('email').value = profile.email || '';
            document.getElementById('full_name').value = profile.full_name || '';
            document.getElementById('timezone').value = profile.timezone || 'UTC';
            
            // Load allergies
            const allergies = profile.allergies || [];
            document.querySelectorAll('input[name="allergies"]').forEach(checkbox => {
                checkbox.checked = allergies.includes(checkbox.value);
            });
        }

        // Save profile data to localStorage
        function saveProfile(event) {
            event.preventDefault();
            
            const profile = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                full_name: document.getElementById('full_name').value,
                timezone: document.getElementById('timezone').value,
                allergies: Array.from(document.querySelectorAll('input[name="allergies"]:checked')).map(cb => cb.value)
            };
            
            localStorage.setItem('userProfile', JSON.stringify(profile));
            
            // Show success message
            showMessage('Profile updated successfully!', 'success');
        }

        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // Clear all data
        function clearAllData() {
            if (confirm('Are you sure you want to clear all your data? This cannot be undone.')) {
                localStorage.clear();
                showMessage('All data cleared successfully!', 'success');
                loadProfile();
            }
        }

        // Make checkbox-item divs clickable
        document.querySelectorAll('.checkbox-item').forEach(item => {
            item.addEventListener('click', function(e) {
                if (e.target.type !== 'checkbox') {
                    const checkbox = this.querySelector('input[type="checkbox"]');
                    if (checkbox) {
                        checkbox.checked = !checkbox.checked;
                    }
                }
            });
        });

        // Event listeners
        document.getElementById('profileForm').addEventListener('submit', saveProfile);
        document.getElementById('clearDataBtn').addEventListener('click', clearAllData);

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
